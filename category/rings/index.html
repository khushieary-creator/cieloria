/* Palmonas Style CSS Tokens & Clean Layout */
:root {
  --bg-nude: #F6F4EF;
  --bg-header-search: #F3EFE6;
  --bg-card: #FFFFFF;
  --bg-dark: #000000;

* {

  margin: 0;
  padding: 0;

/* Subheader Navigation Links Hover & Active State */
.subnav-btn {
  color: #1A1A1A !important;
  font-weight: 500 !important;
  transition: color 0.2s ease, border-color 0.2s ease !important;
  background: transparent !important;
  border: none !important;
  cursor: pointer !important;
}

.subnav-btn:hover {
  color: #C5A059 !important;
}

.subnav-btn.active {
  color: #C5A059 !important;
  font-weight: 700 !important;
  border-bottom: 2px solid #C5A059 !important;
  padding-bottom: 2px !important;
}

::-webkit-scrollbar {

}

}

.btn-palmonas-hero:hover {

}

/* Infinite Seamless Marquee Animation */
.marquee-container {
  display: flex !important;
  overflow: hidden !important;
  user-select: none !important;
  background: #000000 !important;
  color: #FFFFFF !important;
  font-size: 11px !important;
  letter-spacing: 0.08em !important;
  padding: 10px 0 !important;
  white-space: nowrap !important;
  width: 100% !important;
}

.marquee-content {
  flex-shrink: 0 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-around !important;
  min-width: 100% !important;
  gap: 2.5rem !important;
  animation: marquee-infinite 22s linear infinite !important;
}

@keyframes marquee-infinite {
  0% {
    transform: translateX(0%);
  }
  100% {
    transform: translateX(-100%);
  }
}

.card-elevation {
  transition: all 0.3s ease;
}
.card-elevation:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

    function initializeCieloriaApp() {
      if (typeof renderApp === 'function') {
        try {
          cleanTrackingUrl();
          syncAccountStorage();
          syncStateFromUrl();
          renderApp();
        } catch (e) {
          console.error('Render App Execution Error:', e);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeCieloriaApp);
    } else {
      initializeCieloriaApp();
    }
